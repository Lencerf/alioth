[package]
name = "alioth-cli"
version = "0.12.0"
edition.workspace = true
description = "Command-line interface for Alioth, an experimental virtual machine monitor."
readme = "../README.md"
repository.workspace = true
license.workspace = true

[[bin]]
name = "alioth"
path = "src/main.rs"

[dependencies]
alioth.workspace = true
axum = { version = "0.8.9", default-features = false, features = [
  "http1",
  "json",
  "query",
  "tokio",
] }
clap = { version = "4", features = ["derive"] }
flexi_logger.workspace = true
log = "0.4"
miniz_oxide = { version = "0.9", features = ["simd"] }
serde.workspace = true
serde-aco.workspace = true
serde_json = "1"
snafu.workspace = true
tokio = { version = "1", features = ["macros", "net", "rt", "signal"] }
zerocopy.workspace = true

[dev-dependencies]
assert_matches.workspace = true
ctor.workspace = true
parking_lot.workspace = true
pretty_assertions.workspace = true
rstest.workspace = true
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }
